---
# yum-cron and dnf-automatic.timer (dnf4 and dnf5) apply updates when apply_updates is set.
- name: Set correct automatic update utility vars (RHEL >= 8).
  set_fact:
    update_utility: dnf-automatic
    update_service: dnf-automatic.timer
    update_conf_path: /etc/dnf/automatic.conf
  when: ansible_facts.distribution_major_version | int >= 8

- name: Set correct automatic update utility vars (RHEL <= 7).
  set_fact:
    update_utility: yum-cron
    update_service: yum-cron
    update_conf_path: /etc/yum/yum-cron.conf
  when: ansible_facts.distribution_major_version | int <= 7

- name: Install automatic update utility.
  package:
    name: '{{ update_utility }}'
    state: present

- name: Configure autoupdates.
  lineinfile:
    dest: '{{ update_conf_path }}'
    regexp: '{{ item.regexp }}'
    line: '{{ item.line }}'
    insertafter: '{{ item.insertafter | default(omit) }}'
    create: true
    mode: 0644
  loop:
    - regexp: '^\[commands\]'
      line: '[commands]'
    - regexp: '^apply_updates\s*='
      line: 'apply_updates = yes'
      insertafter: '^\[commands\]'

- name: Ensure automatic update utility is running and enabled on boot.
  service:
    name: '{{ update_service }}'
    state: started
    enabled: true

# Replaced by dnf-automatic.timer; dnf5 doesn't ship it.
- name: Disable dnf-automatic-install.timer.
  service:
    name: dnf-automatic-install.timer
    state: stopped
    enabled: false
  when: ansible_facts.pkg_mgr == 'dnf'
